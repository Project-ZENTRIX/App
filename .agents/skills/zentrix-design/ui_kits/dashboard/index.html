<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zentrix Dashboard UI Kit</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="../../components.css">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --uikit-sidebar-w: 240px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--type-sans); background: var(--color-background); color: var(--color-foreground); }
    .uikit-shell { width: 100%; max-width: 1184px; margin: 0 auto; overflow: hidden; display: grid; grid-template-columns: var(--uikit-sidebar-w, 220px) minmax(0, 1fr); gap: var(--space-4); min-height: 100vh; }
    .uikit-sidebar, .uikit-main, .uikit-toolbar { min-width: 0; }
    .uikit-sidebar { overflow: hidden; max-width: 100%; background: var(--color-sidebar); color: var(--color-sidebar-foreground); border-right: 1px solid var(--color-sidebar-border); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
    .brand { font-family: var(--type-heading); font-size: 1.25rem; font-weight: 700; color: var(--color-sidebar-foreground); letter-spacing: -0.02em; }
    .nav { display: flex; flex-direction: column; gap: var(--space-1); }
    .nav-btn { width: 100%; justify-content: flex-start; }
    .uikit-main { padding: var(--space-4) var(--space-4) var(--space-4) 0; display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
    .uikit-toolbar { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
    .uikit-responsive-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
    .uikit-table-wrap { max-width: 100%; overflow-x: auto; overscroll-behavior-x: contain; }
    .uikit-truncate { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .uikit-nowrap { white-space: nowrap; flex-shrink: 0; }
    .uikit-action-cell { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 160px; overflow: hidden; }
    .uikit-action { min-width: 0; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    [data-component] { min-width: 0; max-width: 100%; overflow: hidden; }
    .page-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; min-width: 0; }
    .page-title { font-family: var(--type-heading); font-size: 1.5rem; font-weight: 600; line-height: 1.2; margin: 0; word-break: keep-all; text-wrap: balance; }
    .uikit-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    .uikit-table th { text-align: left; white-space: nowrap; padding: var(--space-2) var(--space-3); color: var(--color-muted-foreground); font-weight: 500; border-bottom: 1px solid var(--color-border); }
    .uikit-table td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--color-border); vertical-align: middle; }
    .uikit-table tr:last-child td { border-bottom: none; }
    .metric-delta { color: var(--color-primary); font-weight: 500; }
    .metric-delta.down { color: var(--color-destructive); }
    .chart-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--space-1); align-items: end; height: 160px; padding-top: var(--space-3); border-top: 1px solid var(--color-border); }
    .chart-bar { width: 100%; border-radius: var(--radius-md) var(--radius-md) 0 0; min-height: 4px; }
    .chart-labels { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--space-1); margin-top: var(--space-2); }
    .chart-labels span { text-align: center; font-size: 0.75rem; color: var(--color-muted-foreground); }
    .barH15 { height: 15%; background: var(--color-chart-1); }
    .barH25 { height: 25%; background: var(--color-chart-2); }
    .barH35 { height: 35%; background: var(--color-chart-2); }
    .barH45 { height: 45%; background: var(--color-chart-3); }
    .barH55 { height: 55%; background: var(--color-chart-3); }
    .barH65 { height: 65%; background: var(--color-chart-4); }
    .barH75 { height: 75%; background: var(--color-chart-4); }
    .barH85 { height: 85%; background: var(--color-chart-5); }
    .barH95 { height: 95%; background: var(--color-chart-5); }
    .form-label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: var(--space-1); color: var(--color-foreground); }
    .form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
    .error-text { color: var(--color-destructive); font-size: 0.75rem; margin-top: var(--space-1); }
    .danger-title { color: var(--color-destructive); }
    .uikit-tabular { font-variant-numeric: tabular-nums; }
    @media (max-width: 900px) {
      .uikit-shell { grid-template-columns: minmax(0, 1fr); }
      .uikit-sidebar { border-right: none; border-bottom: 1px solid var(--color-sidebar-border); }
      .uikit-main { padding: var(--space-4); }
      .uikit-responsive-grid { grid-template-columns: minmax(0, 1fr); }
      .form-row { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 640px) {
      .uikit-toolbar { flex-direction: column; align-items: stretch; }
      .uikit-responsive-grid { grid-template-columns: minmax(0, 1fr); }
      .page-header { flex-direction: column; align-items: flex-start; }
      .chart-grid { height: 120px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function Icon({ name, size = 16, className = '' }) {
      return <i data-lucide={name} className={className} style={{ width: size + 'px', height: size + 'px', display: 'inline-block' }}></i>;
    }

    function Select({ value, onChange, options, placeholder, size = 'default' }) {
      const [open, setOpen] = useState(false);
      const rootRef = useRef(null);
      useEffect(() => {
        function handleClick(e) {
          if (rootRef.current && !rootRef.current.contains(e.target)) setOpen(false);
        }
        document.addEventListener('mousedown', handleClick);
        return () => document.removeEventListener('mousedown', handleClick);
      }, []);
      return (
        <div data-component="select" className={`select-root ${open ? 'is-open' : ''}`} ref={rootRef}>
          <button type="button" className="select-trigger" data-size={size} onClick={() => setOpen(!open)}>
            <span className="select-value" data-placeholder={!value ? '' : undefined}>{value || placeholder}</span>
            <Icon name="chevron-down" size={16} className="select-icon" />
          </button>
          <div className="select-content">
            <div className="select-viewport">
              {options.map((opt) => (
                <div key={opt} className="select-item" data-state={value === opt ? 'checked' : 'unchecked'} onClick={() => { onChange(opt); setOpen(false); }}>
                  <span className="select-item-text">{opt}</span>
                  {value === opt && <Icon name="check" size={16} className="select-item-indicator" />}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function Dialog({ open, onClose, title, description, children }) {
      if (!open) return null;
      return (
        <div data-component="dialog" className="dialog-overlay" onClick={onClose}>
          <div className="dialog-content" role="dialog" aria-modal="true" onClick={(e) => e.stopPropagation()}>
            <div className="dialog-header">
              <h2 className="dialog-title">{title}</h2>
              <p className="dialog-description">{description}</p>
            </div>
            {children}
            <button className="dialog-close" aria-label="关闭" onClick={onClose}><Icon name="x" size={16} /></button>
          </div>
        </div>
      );
    }

    function App() {
      const [view, setView] = useState('overview');
      const [range, setRange] = useState('最近 24 小时');
      const [dialogOpen, setDialogOpen] = useState(false);
      const [language, setLanguage] = useState('简体中文');

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const deployments = [
        { name: 'api-gateway', status: '运行中', variant: 'badge-default', version: 'v2.4.1', time: '10 分钟前' },
        { name: 'billing-worker', status: '完成', variant: 'badge-secondary', version: 'v1.8.3', time: '32 分钟前' },
        { name: 'notify-queue', status: '运行中', variant: 'badge-default', version: 'v0.9.2', time: '1 小时前' },
        { name: 'search-indexer', status: '失败', variant: 'badge-destructive', version: 'v3.0.0', time: '2 小时前' },
        { name: 'auth-service', status: '待处理', variant: 'badge-outline', version: 'v4.2.0', time: '3 小时前' },
        { name: 'report-cron', status: '完成', variant: 'badge-secondary', version: 'v2.1.5', time: '5 小时前' }
      ];

      const events = [
        { name: '高延迟告警', level: '警告', variant: 'badge-outline', source: 'api-gateway', time: '12ms' },
        { name: '数据库连接池耗尽', level: '严重', variant: 'badge-destructive', source: 'billing-db', time: '2.4s' },
        { name: '队列堆积恢复', level: '提示', variant: 'badge-secondary', source: 'notify-queue', time: '45s' },
        { name: '缓存命中率下降', level: '警告', variant: 'badge-outline', source: 'search-indexer', time: '18ms' },
        { name: 'SSL 证书即将过期', level: '提示', variant: 'badge-secondary', source: 'auth-service', time: '3 天' },
        { name: '定时任务跳过', level: '严重', variant: 'badge-destructive', source: 'report-cron', time: '1 小时' }
      ];

      const chartBars = ['barH25', 'barH15', 'barH20', 'barH35', 'barH55', 'barH75', 'barH85', 'barH95', 'barH75', 'barH65', 'barH45', 'barH30'];
      const chartLabels = ['00', '02', '04', '06', '08', '10', '12', '14', '16', '18', '20', '22'];

      return (
        <div className="uikit-shell" data-layout-guard="uikit-v1">
          <aside className="uikit-sidebar">
            <div className="brand">Zentrix</div>
            <nav className="nav">
              <button data-component="button" type="button" className={`btn nav-btn ${view === 'overview' ? 'btn-secondary' : 'btn-ghost'}`} onClick={() => setView('overview')}>
                <Icon name="home" size={16} /><span className="uikit-truncate">概览</span>
              </button>
              <button data-component="button" type="button" className={`btn nav-btn ${view === 'analytics' ? 'btn-secondary' : 'btn-ghost'}`} onClick={() => setView('analytics')}>
                <Icon name="bar-chart-3" size={16} /><span className="uikit-truncate">分析</span>
              </button>
              <button data-component="button" type="button" className={`btn nav-btn ${view === 'settings' ? 'btn-secondary' : 'btn-ghost'}`} onClick={() => setView('settings')}>
                <Icon name="settings" size={16} /><span className="uikit-truncate">设置</span>
              </button>
            </nav>
          </aside>
          <main className="uikit-main">
            {view === 'overview' && (
              <>
                <div className="page-header">
                  <div className="uikit-toolbar" style={{ gap: 'var(--space-3)' }}>
                    <h1 className="page-title">概览</h1>
                    <span data-component="badge" className="badge badge-default">运行中</span>
                  </div>
                </div>
                <div className="uikit-toolbar">
                  <button data-component="button" type="button" className="btn btn-default"><Icon name="plus" size={16} />新建任务</button>
                  <button data-component="button" type="button" className="btn btn-outline"><Icon name="arrow-up-right" size={16} />导出数据</button>
                  <button data-component="button" type="button" className="btn btn-ghost" disabled>暂停同步</button>
                </div>
                <div className="uikit-responsive-grid">
                  <div data-component="card" className="card">
                    <div className="card__header">
                      <div className="card__heading">
                        <h3 className="card__title uikit-truncate">总请求量</h3>
                        <p className="card__description">过去 24 小时</p>
                      </div>
                    </div>
                    <div className="card__content">
                      <div className="card__metric">
                        <span className="card__value uikit-tabular">1,284,391</span>
                        <span className="card__delta metric-delta">+12.3%</span>
                      </div>
                    </div>
                  </div>
                  <div data-component="card" className="card">
                    <div className="card__header">
                      <div className="card__heading">
                        <h3 className="card__title uikit-truncate">成功率</h3>
                        <p className="card__description">HTTP 2xx 占比</p>
                      </div>
                    </div>
                    <div className="card__content">
                      <div className="card__metric">
                        <span className="card__value uikit-tabular">99.97%</span>
                        <span className="card__delta metric-delta">+0.02%</span>
                      </div>
                    </div>
                  </div>
                  <div data-component="card" className="card">
                    <div className="card__header">
                      <div className="card__heading">
                        <h3 className="card__title uikit-truncate">平均延迟</h3>
                        <p className="card__description">P50 响应时间</p>
                      </div>
                    </div>
                    <div className="card__content">
                      <div className="card__metric">
                        <span className="card__value uikit-tabular">42ms</span>
                        <span className="card__delta metric-delta down">-8ms</span>
                      </div>
                    </div>
                  </div>
                  <div data-component="card" className="card">
                    <div className="card__header">
                      <div className="card__heading">
                        <h3 className="card__title uikit-truncate">活跃节点</h3>
                        <p className="card__description">在线服务实例</p>
                      </div>
                    </div>
                    <div className="card__content">
                      <div className="card__metric">
                        <span className="card__value uikit-tabular">24</span>
                        <span className="card__delta metric-delta">+2</span>
                      </div>
                    </div>
                  </div>
                </div>
                <div data-component="card" className="card">
                  <div className="card__header">
                    <div className="card__heading">
                      <h3 className="card__title uikit-truncate">最近部署</h3>
                      <p className="card__description">近 24 小时发布记录</p>
                    </div>
                    <button data-component="button" type="button" className="btn btn-outline btn-sm">查看全部</button>
                  </div>
                  <div className="card__content">
                    <div className="uikit-table-wrap">
                      <table className="uikit-table">
                        <thead>
                          <tr><th>服务</th><th>状态</th><th>版本</th><th>时间</th><th>操作</th></tr>
                        </thead>
                        <tbody>
                          {deployments.map((row, i) => (
                            <tr key={i}>
                              <td><span className="uikit-truncate">{row.name}</span></td>
                              <td><span data-component="badge" className={`badge ${row.variant}`}>{row.status}</span></td>
                              <td className="uikit-nowrap uikit-tabular">{row.version}</td>
                              <td className="uikit-nowrap uikit-tabular">{row.time}</td>
                              <td>
                                <div className="uikit-action-cell">
                                  <button data-component="button" type="button" className="btn btn-outline btn-sm uikit-action">查看</button>
                                  <button data-component="button" type="button" className="btn btn-ghost btn-sm" aria-label="编辑"><Icon name="edit" size={16} /></button>
                                </div>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </>
            )}
            {view === 'analytics' && (
              <>
                <div className="page-header">
                  <div className="uikit-toolbar" style={{ gap: 'var(--space-3)' }}>
                    <h1 className="page-title">流量分析</h1>
                    <span data-component="badge" className="badge badge-default">实时</span>
                  </div>
                </div>
                <div className="uikit-toolbar">
                  <span className="uikit-nowrap" style={{ color: 'var(--color-muted-foreground)', fontSize: '0.875rem' }}>时间范围</span>
                  <Select value={range} onChange={setRange} options={['最近 1 小时', '最近 6 小时', '最近 24 小时', '最近 7 天']} placeholder="选择时间范围" />
                  <button data-component="button" type="button" className="btn btn-outline"><Icon name="filter" size={16} />刷新</button>
                  <button data-component="button" type="button" className="btn btn-default"><Icon name="arrow-up-right" size={16} />生成报告</button>
                  <button data-component="button" type="button" className="btn btn-ghost" disabled>导出原始数据</button>
                </div>
                <div data-component="card" className="card">
                  <div className="card__header">
                    <div className="card__heading">
                      <h3 className="card__title uikit-truncate">每小时请求量</h3>
                      <p className="card__description">QPS 趋势（最近 24 小时）</p>
                    </div>
                  </div>
                  <div className="card__content">
                    <div className="chart-grid">
                      {chartBars.map((cls, i) => <div key={i} className={`chart-bar ${cls}`}></div>)}
                    </div>
                    <div className="chart-labels">
                      {chartLabels.map((l, i) => <span key={i} className="uikit-tabular">{l}</span>)}
                    </div>
                  </div>
                </div>
                <div data-component="card" className="card">
                  <div className="card__header">
                    <div className="card__heading">
                      <h3 className="card__title uikit-truncate">最近事件</h3>
                      <p className="card__description">按级别聚合</p>
                    </div>
                  </div>
                  <div className="card__content">
                    <div className="uikit-table-wrap">
                      <table className="uikit-table">
                        <thead>
                          <tr><th>事件</th><th>级别</th><th>来源</th><th>耗时</th><th>操作</th></tr>
                        </thead>
                        <tbody>
                          {events.map((row, i) => (
                            <tr key={i}>
                              <td><span className="uikit-truncate">{row.name}</span></td>
                              <td><span data-component="badge" className={`badge ${row.variant}`}>{row.level}</span></td>
                              <td><span className="uikit-truncate">{row.source}</span></td>
                              <td className="uikit-nowrap uikit-tabular">{row.time}</td>
                              <td>
                                <div className="uikit-action-cell">
                                  <button data-component="button" type="button" className="btn btn-outline btn-sm uikit-action">定位</button>
                                  <button data-component="button" type="button" className="btn btn-ghost btn-sm" aria-label="删除"><Icon name="trash" size={16} /></button>
                                </div>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </>
            )}
            {view === 'settings' && (
              <>
                <div className="page-header">
                  <h1 className="page-title">工作区设置</h1>
                </div>
                <div className="uikit-toolbar">
                  <button data-component="button" type="button" className="btn btn-default"><Icon name="check" size={16} />保存更改</button>
                  <button data-component="button" type="button" className="btn btn-outline">取消</button>
                  <button data-component="button" type="button" className="btn btn-ghost" disabled>撤销更改</button>
                </div>
                <div data-component="card" className="card">
                  <div className="card__header">
                    <div className="card__heading">
                      <h3 className="card__title uikit-truncate">基本设置</h3>
                      <p className="card__description">管理工作区名称与通知偏好</p>
                    </div>
                  </div>
                  <div className="card__content">
                    <div className="form-row">
                      <div>
                        <label className="form-label" htmlFor="workspace">工作区名称</label>
                        <input data-component="input" id="workspace" type="text" className="input" defaultValue="Zentrix Production" />
                      </div>
                      <div>
                        <label className="form-label" htmlFor="email">通知邮箱</label>
                        <input data-component="input" id="email" type="text" className="input" aria-invalid="true" defaultValue="ops@example" />
                        <p className="error-text">邮箱格式不正确</p>
                      </div>
                    </div>
                    <div className="form-row" style={{ marginTop: 'var(--space-4)' }}>
                      <div>
                        <label className="form-label" htmlFor="org">组织 ID</label>
                        <input data-component="input" id="org" type="text" className="input" disabled defaultValue="org-7a8fc3ec" />
                      </div>
                      <div>
                        <label className="form-label">界面语言</label>
                        <Select value={language} onChange={setLanguage} options={['简体中文', 'English']} placeholder="选择语言" />
                      </div>
                    </div>
                  </div>
                </div>
                <div data-component="card" className="card">
                  <div className="card__header">
                    <div className="card__heading">
                      <h3 className="card__title danger-title uikit-truncate">危险操作</h3>
                      <p className="card__description">以下操作不可逆，请谨慎处理</p>
                    </div>
                  </div>
                  <div className="card__content">
                    <div className="uikit-toolbar">
                      <button data-component="button" type="button" className="btn btn-destructive" onClick={() => setDialogOpen(true)}><Icon name="trash" size={16} />删除账户</button>
                      <button data-component="button" type="button" className="btn btn-destructive" disabled>注销会话</button>
                    </div>
                  </div>
                </div>
                <Dialog open={dialogOpen} onClose={() => setDialogOpen(false)} title="确认删除账户？" description="删除后所有项目数据将被清除，无法恢复。">
                  <div className="dialog-footer">
                    <button type="button" className="dialog-btn dialog-btn-secondary" onClick={() => setDialogOpen(false)}>取消</button>
                    <button type="button" className="dialog-btn dialog-btn-primary" onClick={() => setDialogOpen(false)}>确认删除</button>
                  </div>
                </Dialog>
              </>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
