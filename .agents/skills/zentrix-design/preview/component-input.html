<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input — Zentrix</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--type-sans); color: var(--color-foreground); }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }
  .label { flex-shrink: 0; width: 92px; font-size: 12px; font-weight: 500; color: var(--color-muted-foreground); text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; }
  .field { flex: 1; min-width: 120px; max-width: 320px; }
  .divider { border: 0; border-top: 1px solid var(--color-border); margin: 12px 0; }

  /* @component-css-start */
  /* Component definitions — extracted to components.css by deterministic script */
  .input { display: block; width: 100%; min-width: 0; height: 32px; padding: 4px 10px; border: 1px solid var(--color-input); border-radius: var(--radius-lg); background: var(--color-background); color: var(--color-foreground); font-size: 14px; line-height: 20px; outline: none; }
  .input::placeholder { color: var(--color-muted-foreground); }
  .input:focus-visible { border-color: var(--color-ring); box-shadow: 0 0 0 2px color-mix(in srgb, var(--color-ring) 50%, transparent); }
  .input:disabled { background: color-mix(in srgb, var(--color-input) 50%, transparent); }
  .input[aria-invalid="true"] { border-color: var(--color-destructive); box-shadow: 0 0 0 2px color-mix(in srgb, var(--color-destructive) 20%, transparent); }
  .input-file { position: relative; display: inline-flex; align-items: center; gap: 8px; width: 100%; }
  .input-file-native { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .input-file-button { display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 4px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-secondary); color: var(--color-secondary-foreground); font-size: 14px; line-height: 20px; cursor: pointer; white-space: nowrap; transition: filter .15s; }
  .input-file-button:hover { filter: brightness(1.08); }
  .input-file-name { flex: 1; min-width: 0; color: var(--color-muted-foreground); font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row">
    <span class="label">默认</span>
    <div class="field"><input type="text" class="input" placeholder="请输入工作区名称"></div>
  </div>
  <div class="row">
    <span class="label">禁用</span>
    <div class="field"><input type="text" class="input" value="只读内容" disabled></div>
  </div>
  <div class="row">
    <span class="label">错误</span>
    <div class="field"><input type="email" class="input" value="invalid@example" aria-invalid="true"></div>
  </div>
  <hr class="divider">
  <div class="row">
    <span class="label">文件</span>
    <div class="field">
      <label class="input-file">
        <input type="file" class="input-file-native">
        <span class="input-file-button">选择文件</span>
        <span class="input-file-name">未选择文件</span>
      </label>
    </div>
  </div>
</body>
</html>
