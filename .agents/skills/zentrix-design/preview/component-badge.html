<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: 12px; background: var(--color-background); color: var(--color-foreground); font-family: var(--type-sans); }
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.label { width: 92px; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--color-muted-foreground); letter-spacing: 0.03em; flex-shrink: 0; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: 8px 0; }

/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.badge { display: inline-flex; align-items: center; justify-content: center; gap: 4px; box-sizing: border-box; height: 20px; padding: 2px 8px; border-radius: var(--radius-4xl); font-size: 12px; font-weight: 500; line-height: 1; white-space: nowrap; flex-shrink: 0; min-width: 20px; }
.badge-default { background: var(--color-primary); color: var(--color-primary-foreground); }
.badge-secondary { background: var(--color-secondary); color: var(--color-secondary-foreground); }
.badge-destructive { background: color-mix(in srgb, var(--color-destructive) 12%, var(--color-background)); color: var(--color-destructive); }
.badge-outline { background: transparent; color: var(--color-foreground); border: 1px solid var(--color-border); }
.badge-ghost { background: transparent; color: var(--color-foreground); }
.badge-link { background: transparent; color: var(--color-primary); text-decoration: underline; }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">状态</span><span class="badge badge-default">进行中</span><span class="badge badge-secondary">待处理</span><span class="badge badge-destructive">失败</span></div>
<div class="row"><span class="label">分类</span><span class="badge badge-outline">草稿</span><span class="badge badge-ghost">归档</span><span class="badge badge-link">查看</span></div>
</body>
</html>
