/* Zentrix Design Library — Colors & Typography Tokens */

/* ─────────────────────────────────────────────────────────────── */
/* PRIMITIVE TOKENS                                               */
/* ─────────────────────────────────────────────────────────────── */

:root {
    /* Background */
    --background: #fff;

    /* Foreground */
    --foreground: #09090b;

    /* Card */
    --card: #fff;
    --card-foreground: #09090b;

    /* Popover */
    --popover: #fff;
    --popover-foreground: #09090b;

    /* Primary */
    --primary: #008235;
    --primary-foreground: #f0fdf4;

    /* Secondary */
    --secondary: #f4f4f5;
    --secondary-foreground: #18181b;

    /* Muted */
    --muted: #f4f4f5;
    --muted-foreground: #71717b;

    /* Accent */
    --accent: #f4f4f5;
    --accent-foreground: #18181b;

    /* Destructive */
    --destructive: #e7000b;

    /* Border */
    --border: #e4e4e7;

    /* Input */
    --input: #e4e4e7;

    /* Ring */
    --ring: #9f9fa9;

    /* Chart */
    --chart-1: #7bf1a7;
    --chart-2: #00c950;
    --chart-3: #00a63e;
    --chart-4: #008235;
    --chart-5: #026630;

    /* Sidebar */
    --sidebar: #fafafa;
    --sidebar-foreground: #09090b;
    --sidebar-primary: #00a63e;
    --sidebar-primary-foreground: #f0fdf4;
    --sidebar-accent: #f4f4f5;
    --sidebar-accent-foreground: #18181b;
    --sidebar-border: #e4e4e7;
    --sidebar-ring: #9f9fa9;

    /* Radius */
    --radius: 0.45rem;
    --radius-sm: 4.3px;
    --radius-md: 5.8px;
    --radius-lg: 7.2px;
    --radius-xl: 10.1px;
    --radius-2xl: 13px;
    --radius-3xl: 15.8px;
    --radius-4xl: 18.7px;

    /* Font */
    --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-heading: var(--font-sans);
}

/* ─────────────────────────────────────────────────────────────── */
/* DARK MODE TOKENS                                               */
/* ─────────────────────────────────────────────────────────────── */

.dark {
    /* Background */
    --background: #09090b;

    /* Foreground */
    --foreground: #fafafa;

    /* Card */
    --card: #18181b;
    --card-foreground: #fafafa;

    /* Popover */
    --popover: #18181b;
    --popover-foreground: #fafafa;

    /* Primary */
    --primary: #026630;
    --primary-foreground: #f0fdf4;

    /* Secondary */
    --secondary: #27272a;
    --secondary-foreground: #fafafa;

    /* Muted */
    --muted: #27272a;
    --muted-foreground: #9f9fa9;

    /* Accent */
    --accent: #27272a;
    --accent-foreground: #fafafa;

    /* Destructive */
    --destructive: #ff6467;

    /* Border */
    --border: rgba(255, 255, 255, 0.1);

    /* Input */
    --input: rgba(255, 255, 255, 0.15);

    /* Ring */
    --ring: #71717b;

    /* Chart */
    --chart-1: #7bf1a7;
    --chart-2: #00c950;
    --chart-3: #00a63e;
    --chart-4: #008235;
    --chart-5: #026630;

    /* Sidebar */
    --sidebar: #18181b;
    --sidebar-foreground: #fafafa;
    --sidebar-primary: #00c950;
    --sidebar-primary-foreground: #f0fdf4;
    --sidebar-accent: #27272a;
    --sidebar-accent-foreground: #fafafa;
    --sidebar-border: rgba(255, 255, 255, 0.1);
    --sidebar-ring: #71717b;
}

}
