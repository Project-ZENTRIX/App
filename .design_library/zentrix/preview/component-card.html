<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card - Zentrix</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: 0.75rem; background: var(--color-background); font-family: var(--type-sans); color: var(--color-foreground); }
  .row { display: flex; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.5rem; }
  .row:last-child { margin-bottom: 0; }
  .label { flex-shrink: 0; width: 92px; padding-top: 0.75rem; font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-muted-foreground); }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: 0.75rem 0; }
  /* @component-css-start */
  /* Component definitions — extracted to components.css by deterministic script */
  .card { display: flex; flex-direction: column; gap: 1rem; width: 100%; padding: 1rem; background: var(--color-card); color: var(--color-card-foreground); border-radius: var(--radius-xl); box-shadow: 0 0 0 1px color-mix(in srgb, var(--color-foreground) 10%, transparent); box-sizing: border-box; }
  .card-sm { gap: 0.75rem; padding: 0.75rem; }
  .card-sm .card__image { width: calc(100% + 1.5rem); height: 120px; margin: -0.75rem -0.75rem 0; background: linear-gradient(135deg, var(--color-muted) 0%, var(--color-border) 100%); border-radius: var(--radius-xl) var(--radius-xl) 0 0; }
  .card__header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; }
  .card__heading { flex: 1; min-width: 0; }
  .card__title { font-family: var(--type-heading); font-size: 1rem; font-weight: 600; line-height: 1.25; margin: 0; }
  .card__description { font-size: 0.875rem; line-height: 1.4; color: var(--color-muted-foreground); margin: 0.25rem 0 0; }
  .card__action { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 0.5rem; border-radius: var(--radius-md); background: transparent; color: var(--color-primary); font-size: 0.75rem; cursor: pointer; transition: background .15s; white-space: nowrap; }
  .card__action:hover { background: var(--color-muted); }
  .card__content { font-size: 0.875rem; line-height: 1.5; }
  .card__metric { display: flex; align-items: baseline; gap: 0.5rem; }
  .card__value { font-family: var(--type-heading); font-size: 1.5rem; font-weight: 700; }
  .card__delta { font-size: 0.875rem; color: var(--color-primary); }
  .card__list { margin: 0; padding: 0; list-style: none; }
  .card__list li { padding: 0.25rem 0; }
  .card__footer { margin: 0 -1rem -1rem; padding: 0.75rem 1rem; border-top: 1px solid var(--color-border); background: var(--color-muted); border-radius: 0 0 var(--radius-xl) var(--radius-xl); font-size: 0.75rem; color: var(--color-muted-foreground); }
  .card-sm .card__footer { margin: 0 -0.75rem -0.75rem; padding: 0.5rem 0.75rem; }
  /* @component-css-end */
</style>
</head>
<body>
<div class="row">
  <span class="label">默认</span>
  <div class="card">
    <div class="card__header">
      <div class="card__heading">
        <h3 class="card__title">本月活跃用户</h3>
        <p class="card__description">统计周期：2024 年 3 月</p>
      </div>
      <button class="card__action" type="button">导出</button>
    </div>
    <div class="card__content">
      <div class="card__metric"><span class="card__value">12,480</span><span class="card__delta">+8.2%</span></div>
    </div>
    <div class="card__footer">上次更新：2 分钟前</div>
  </div>
</div>
<hr class="divider">
<div class="row">
  <span class="label">小尺寸</span>
  <div class="card card-sm">
    <div class="card__image" aria-hidden="true"></div>
    <div class="card__header">
      <div class="card__heading">
        <h3 class="card__title">服务器状态</h3>
        <p class="card__description">所有核心服务运行正常</p>
      </div>
      <button class="card__action" type="button">刷新</button>
    </div>
    <div class="card__content">
      <ul class="card__list">
        <li>API 响应 34 ms</li>
        <li>数据库延迟 12 ms</li>
      </ul>
    </div>
    <div class="card__footer">监控中</div>
  </div>
</div>
</body>
</html>
