<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dialog - Zentrix</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--type-sans); color: var(--color-foreground); }
  .row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
  .label { width: 92px; flex-shrink: 0; font-size: 12px; line-height: 16px; color: var(--color-muted-foreground); text-transform: uppercase; padding-top: 8px; }
  .preview-box { position: relative; width: 100%; height: 220px; overflow: hidden; border: 1px dashed var(--color-border); border-radius: var(--radius-lg); background: var(--color-muted); }
  .preview-box .dialog-overlay { position: absolute; }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: 16px 0; }

  /* @component-css-start */
  .dialog-overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: color-mix(in srgb, var(--color-background) 80%, transparent); backdrop-filter: blur(4px); }
  .dialog-content { position: relative; width: 100%; max-width: calc(100% - 2rem); padding: 16px; border-radius: var(--radius-xl); background: var(--color-popover); color: var(--color-popover-foreground); box-shadow: 0 0 0 1px color-mix(in srgb, var(--color-foreground) 10%, transparent); }
  @media (min-width: 640px) { .dialog-content { max-width: 384px; } }
  .dialog-header { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; padding-right: 24px; }
  .dialog-title { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.5; color: var(--color-popover-foreground); }
  .dialog-description { margin: 0; font-size: 14px; line-height: 1.5; color: var(--color-muted-foreground); }
  .dialog-close { position: absolute; top: 16px; right: 16px; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: none; border-radius: var(--radius-md); background: transparent; cursor: pointer; transition: background .15s; }
  .dialog-close:hover { background: var(--color-muted); }
  .dialog-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--color-border); }
  .dialog-btn { display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 32px; padding: 0 12px; border: none; border-radius: var(--radius-md); font-size: 14px; font-weight: 500; line-height: 1; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s; }
  .dialog-btn-secondary { background: var(--color-secondary); color: var(--color-secondary-foreground); }
  .dialog-btn-secondary:hover { filter: brightness(1.08); }
  .dialog-btn-primary { background: var(--color-primary); color: var(--color-primary-foreground); }
  .dialog-btn-primary:hover { filter: brightness(1.08); }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row">
    <span class="label">带关闭</span>
    <div class="preview-box">
      <div class="dialog-overlay">
        <div class="dialog-content" role="dialog" aria-modal="true" aria-labelledby="d1-title" aria-describedby="d1-desc">
          <div class="dialog-header">
            <h2 class="dialog-title" id="d1-title">确认删除项目？</h2>
            <p class="dialog-description" id="d1-desc">删除后数据将无法恢复，请谨慎操作。</p>
          </div>
          <button class="dialog-close" aria-label="关闭"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/x.svg" width="16" height="16" alt="关闭"></button>
          <div class="dialog-footer">
            <button class="dialog-btn dialog-btn-secondary">取消</button>
            <button class="dialog-btn dialog-btn-primary">删除</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <hr class="divider">
  <div class="row">
    <span class="label">无关闭</span>
    <div class="preview-box">
      <div class="dialog-overlay">
        <div class="dialog-content" role="dialog" aria-modal="true" aria-labelledby="d2-title" aria-describedby="d2-desc">
          <div class="dialog-header">
            <h2 class="dialog-title" id="d2-title">同步完成</h2>
            <p class="dialog-description" id="d2-desc">所有数据已同步至云端。</p>
          </div>
          <div class="dialog-footer">
            <button class="dialog-btn dialog-btn-primary">知道了</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
