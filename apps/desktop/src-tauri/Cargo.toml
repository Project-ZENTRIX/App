[package]
name = "zentrix-student-client"
version = "0.0.1"
edition = "2021"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lib]
name = "zentrix_student_client"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[test]]
name = "client_snapshot"
path = "test/client_snapshot.rs"
